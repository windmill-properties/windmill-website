<title>Windmill Properties — Apartments for Rent in Rhode Island</title>
<meta name="description" content="Windmill Properties — quality apartments in Providence, Bristol, Pawtucket and Newport, Rhode Island.">

<style>
:root{
  --navy:#1b2f5e; --navy-2:#142344; --navy-3:#0e1930;
  --red:#b5222d; --gold:#c9a227; --green:#1e7d4f;
  --cream:#faf7f2; --paper:#ffffff; --ink:#22293a; --mut:#66708a;
  --line:#e4e1d8; --rad:14px;
  --shadow:0 10px 30px rgba(20,35,68,.10);
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.55}
img{display:block;max-width:100%}
a{color:var(--navy);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding:10px 22px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand svg{width:44px;height:44px;color:var(--navy)}
.brand .bt{line-height:1.05}
.brand .bt b{display:block;font-family:var(--serif);letter-spacing:.22em;font-size:19px;color:var(--navy)}
.brand .bt span{display:block;font-size:9.5px;letter-spacing:.42em;color:var(--red);font-weight:700;margin-top:3px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:9px 13px;border-radius:9px;font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap}
nav a:hover{background:#eef1f7}
nav a.on{background:var(--navy);color:#fff}
nav a.cta{background:var(--red);color:#fff;margin-left:6px}
nav a.cta:hover{background:#9a1c26}

/* ---------- hero ---------- */
.hero{position:relative;color:#fff;overflow:hidden;background:var(--navy-3)}
.hero .tiles{display:grid;grid-template-columns:repeat(4,1fr);position:absolute;inset:0;opacity:.55}
.hero .tiles div{background-size:cover;background-position:center;filter:saturate(.9)}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,25,48,.55),rgba(14,25,48,.82))}
.hero .inner{position:relative;text-align:center;padding:92px 22px 84px}
.hero svg.mark{width:92px;height:92px;color:#fff;margin:0 auto 14px}
.hero h1{font-family:var(--serif);font-size:clamp(34px,5.4vw,58px);letter-spacing:.14em}
.hero .sub{letter-spacing:.5em;font-size:12px;color:var(--gold);font-weight:700;margin:10px 0 18px}
.hero p.tag{max-width:620px;margin:0 auto 30px;font-size:18px;color:#e8ecf5}
.btn{display:inline-block;padding:13px 26px;border-radius:10px;font-weight:700;font-size:15px}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:#9a1c26}
.btn.ghost{border:2px solid rgba(255,255,255,.75);color:#fff;margin-left:10px}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.navy{background:var(--navy);color:#fff}

/* ---------- stats ---------- */
.stats{background:var(--navy);color:#fff}
.stats .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:26px 22px;max-width:1180px;margin:0 auto;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:32px;color:var(--gold)}
.stats span{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#c9d2e6}

/* ---------- sections ---------- */
section.pad{padding:64px 0}
.kick{color:var(--red);font-weight:800;letter-spacing:.3em;font-size:12px;text-transform:uppercase;text-align:center}
h2.sec{font-family:var(--serif);font-size:clamp(26px,3.4vw,38px);color:var(--navy);text-align:center;margin:8px 0 8px}
p.lead{max-width:760px;margin:0 auto;text-align:center;color:var(--mut);font-size:17px}
.about{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;margin-top:40px}
.about .txt p{margin-bottom:14px;font-size:16.5px;color:#3a4258}
.about .imgs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.about .imgs img{border-radius:var(--rad);box-shadow:var(--shadow);aspect-ratio:4/3;object-fit:cover;width:100%}

/* ---------- city cards ---------- */
.cities{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:38px}
.citycard{position:relative;border-radius:var(--rad);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);aspect-ratio:3/3.6;background:var(--navy)}
.citycard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.citycard:hover img{transform:scale(1.06)}
.citycard .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(14,25,48,.88));display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff}
.citycard h3{font-family:var(--serif);font-size:clamp(17px,1.85vw,22px);letter-spacing:.02em;line-height:1.15;white-space:normal;overflow-wrap:normal;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.citycard span{font-size:13px;color:#d8dfee}
.citycard .go{margin-top:8px;font-size:13px;font-weight:700;color:var(--gold)}

/* ---------- city page ---------- */
.cityhero{position:relative;min-height:260px;background:var(--navy-3);color:#fff;display:flex;align-items:flex-end}
.cityhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.cityhero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,25,48,.15),rgba(14,25,48,.87))}
.cityhero .inner{position:relative;padding:120px 22px 30px;max-width:1180px;margin:0 auto;width:100%}
.cityhero h1{font-family:var(--serif);font-size:clamp(30px,4.4vw,46px)}
.cityhero p{max-width:700px;color:#dfe5f0;margin-top:6px}
.crumbs{font-size:13px;margin-bottom:8px;color:#c8d1e4}
.crumbs a{color:var(--gold);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
.pcard{background:var(--paper);border-radius:var(--rad);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line);transition:transform .25s}
.pcard:hover{transform:translateY(-4px)}
.pcard .ph{aspect-ratio:4/2.9;overflow:hidden;background:linear-gradient(135deg,var(--navy),#31518f);position:relative}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .ph .mill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pcard .ph .mill svg{width:64px;height:64px;color:rgba(255,255,255,.65)}
.pcard .bd{padding:16px 18px 18px}
.pcard h3{font-family:var(--serif);color:var(--navy);font-size:19px}
.pcard .meta{font-size:13.5px;color:var(--mut);margin-top:4px}
.pcard .chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:#eef1f7;color:var(--navy)}
.chip.av{background:#e2f3ea;color:var(--green)}
.chip.cm{background:#f7efd8;color:#8a6d14}

/* ---------- property page ---------- */
.prophead{background:var(--navy);color:#fff;padding:34px 0 26px}
.prophead h1{font-family:var(--serif);font-size:clamp(26px,3.6vw,40px)}
.prophead .meta{color:#c9d2e6;margin-top:4px;font-size:15px}
.propmain{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;margin-top:28px;align-items:start}
.bigph{border-radius:var(--rad);overflow:hidden;box-shadow:var(--shadow)}
.bigph img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pgal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.pgal img{aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.units h2{font-family:var(--serif);color:var(--navy);font-size:24px;margin-bottom:12px}
.unit{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.unit .head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.unit .head:hover{background:#fbfaf6}
.unit .nm{font-weight:800;color:var(--navy);font-size:15.5px;min-width:110px}
.unit .sp{color:var(--mut);font-size:13.5px}
.unit .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.unit .rent{font-weight:800;color:var(--navy)}
.badge{font-size:11px;font-weight:800;letter-spacing:.05em;padding:4px 10px;border-radius:99px;text-transform:uppercase}
.badge.av{background:var(--green);color:#fff}
.badge.cm{background:var(--gold);color:#fff}
.badge.oc{background:#e6e6e2;color:#7a7f8e}
.unit .caret{color:var(--mut);transition:transform .25s;font-size:12px}
.unit.open .caret{transform:rotate(90deg)}
.unit .body{display:none;padding:4px 16px 16px;border-top:1px dashed var(--line)}
.unit.open .body{display:block}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ugal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ugal img{aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;transition:opacity .2s}
.ugal img:hover{opacity:.85}
.nogal{font-size:13.5px;color:var(--mut);font-style:italic}
.inq{margin-top:12px}
.inq a{font-weight:700;color:var(--red)}

/* ---------- available ---------- */
.avail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
.acard{background:var(--paper);border-radius:var(--rad);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column}
.acard .ph{aspect-ratio:4/2.7;overflow:hidden;background:linear-gradient(135deg,var(--navy),#31518f);position:relative;cursor:pointer}
.acard .ph img{width:100%;height:100%;object-fit:cover}
.acard .bd{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.acard h3{font-family:var(--serif);color:var(--navy);font-size:18px}
.acard .meta{color:var(--mut);font-size:13.5px;margin:4px 0 10px}
.acard .rentrow{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.acard .rent{font-size:20px;font-weight:800;color:var(--navy)}
.acard .rent small{font-size:12px;color:var(--mut);font-weight:600}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--rad);padding:34px;text-align:center;color:var(--mut);margin-top:26px}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:36px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:30px;text-align:center}
.ccard .ic{width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px}
.ccard h3{font-family:var(--serif);color:var(--navy);margin-bottom:6px}
.ccard a{font-weight:700;color:var(--red);word-break:break-all}
.ccard p{color:var(--mut);font-size:14px;margin-top:6px}

/* ---------- footer ---------- */
footer{background:var(--navy-3);color:#aab6d0;margin-top:70px}
footer .top{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px;padding:44px 22px;max-width:1180px;margin:0 auto}
footer .fb{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}
footer .fb svg{width:34px;height:34px}
footer .fb b{font-family:var(--serif);letter-spacing:.2em}
footer h4{color:#fff;font-size:13px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}
footer a{color:#c8d2e8;display:block;font-size:14px;padding:2px 0}
footer a:hover{color:var(--gold)}
footer .eho{border-top:1px solid rgba(255,255,255,.12);padding:16px 22px;text-align:center;font-size:12.5px}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;background:rgba(10,15,28,.94);z-index:100;display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#lb .x{position:absolute;top:18px;right:26px;color:#fff;font-size:34px;cursor:pointer;line-height:1}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:44px;cursor:pointer;padding:20px;user-select:none}
#lb .prev{left:6px}#lb .next{right:6px}
#lb .cnt{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#c8d2e8;font-size:13px}

@media(max-width:940px){
  .cities{grid-template-columns:repeat(2,1fr)}
  .grid3,.avail-grid,.contact-grid{grid-template-columns:repeat(2,1fr)}
  .about{grid-template-columns:1fr}
  .propmain{grid-template-columns:1fr}
  footer .top{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  .grid3,.avail-grid,.contact-grid,.cities{grid-template-columns:1fr}
  .stats .row{grid-template-columns:repeat(2,1fr);gap:18px}
  .hero .tiles{grid-template-columns:repeat(2,1fr)}
  nav a{padding:7px 10px;font-size:13px}
  .ugal{grid-template-columns:repeat(3,1fr)}
  .pgal{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

ssets/p/174-wood-street.jpg","gallery":[]},{"key":"707 Main","slug":"707-main-street","name":"707 Main Street","city":"Warren","units":[{"id":"1","label":"Unit 1","beds":1,"baths":"","parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"2","label":"Unit 2","beds":1,"baths":"","parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"3","label":"Unit 3","beds":1,"baths":"","parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"B","label":"Unit B","beds":1,"baths":"","parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"G1","label":"Garage 1","beds":"G","baths":0,"parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"G2","label":"Garage 2","beds":"G","baths":0,"parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"G3","label":"Garage 3","beds":"G","baths":0,"parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"G4","label":"Garage 4","beds":"G","baths":0,"parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"G5","label":"Garage 5","beds":"G","baths":0,"parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"G6","label":"Garage 6","beds":"G","baths":0,"parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"G7","label":"Garage 7","beds":"G","baths":0,"parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]},{"id":"G8","label":"Garage 8","beds":"G","baths":0,"parking":"Y","laundry":"N","status":"occupied","rent":null,"gallery":[]}],"img":"assets/p/707-main-street.jpg","gallery":[]}],"contact":{"email":"management@windmill-properties.com","phone":"(401) 379-8294","phone_raw":"4013798294","address":"PO Box 51243, Boston, MA 02205"}},"stats":{"props":36,"units":169,"cities":6,"avail":2,"coming":11}};
const D = SITE.data, S = SITE.stats;
const $ = s => document.querySelector(s);
const app = $('#app');
const money = v => v ? '$' + Number(v).toLocaleString() : '';
const bedTxt = b => b==='G' ? 'Garage bay' : (b===0||b==='0') ? 'Studio' : b===''? '' : b+' bed';
const propBy = slug => D.properties.find(p => p.slug === slug);
const millPh = `<div class="mill"><svg><use href="#mill"/></svg></div>`;

/* ---------- nav ---------- */
function buildNav(){
  let h = `<a href="#/" data-r="home">Home</a>`;
  D.cities.forEach(c => h += `<a href="#/city/${c.id}" data-r="city/${c.id}">${c.name.replace(', CT','')}</a>`);
  h += `<a href="#/available" data-r="available">Available Units</a>`;
  h += `<a class="cta" href="#/contact" data-r="contact">Contact Us</a>`;
  $('#nav').innerHTML = h;
  let fc = '';
  D.cities.forEach(c => fc += `<a href="#/city/${c.id}">${c.name}</a>`);
  $('#footcities').innerHTML = fc;
  $('#fmail').textContent = D.contact.email; $('#fmail').href = 'mailto:'+D.contact.email;
  $('#fphone').textContent = D.contact.phone; $('#fphone').href = 'tel:'+D.contact.phone_raw;
  $('#faddr').textContent = D.contact.address;
  $('#yr').textContent = new Date().getFullYear();
}

/* ---------- views ---------- */
function vHome(){
  const tiles = D.cities.filter(c=>c.hero).map(c=>`<div style="background-image:url('${c.hero}')"></div>`).join('');
  const cityCards = D.cities.map(c => `
    <div class="citycard" onclick="location.hash='#/city/${c.id}'">
      ${c.hero ? `<img src="${c.hero}" alt="${c.name}" loading="lazy">` : ''}
      <div class="ov">
        <h3>${c.name}</h3>
        <span>${c.count} propert${c.count>1?'ies':'y'} · ${c.units} units</span>
        <span class="go">Browse homes →</span>
      </div>
    </div>`).join('');
  const galsample = [];
  for (const p of D.properties){ if (p.img && ['providence','bristol'].includes(p.city.toLowerCase())) galsample.push(p.img); if (galsample.length>=4) break; }
  return `
  <div class="hero">
    <div class="tiles">${tiles}</div><div class="veil"></div>
    <div class="inner">
      <svg class="mark"><use href="#mill"/></svg>
      <h1>WINDMILL PROPERTIES</h1>
      <div class="sub">RHODE ISLAND APARTMENT HOMES</div>
      <p class="tag">Classic New England homes, thoughtfully renovated and proudly managed — in Providence, Bristol, Pawtucket, and Newport.</p>
      <a class="btn red" href="#/available">See Available Units</a>
      <a class="btn ghost" href="#/contact">Contact Us</a>
    </div>
  </div>
  <div class="stats"><div class="row">
    <div><b>${S.props}</b><span>Properties</span></div>
    <div><b>${S.units}</b><span>Units &amp; Garages</span></div>
    <div><b>4</b><span>Rhode Island Cities</span></div>
    <div><b>${S.avail + S.coming}</b><span>Available &amp; Coming Soon</span></div>
  </div></div>
  <section class="pad"><div class="wrap">
    <div class="kick">Our Company</div>
    <h2 class="sec">Rooted in Rhode Island</h2>
    <div class="about">
      <div class="txt">
        <p>Windmill Properties is a family-owned multifamily real estate company based in Rhode Island. We own and manage a portfolio of classic New England apartment homes — triple-deckers, historic cottages, and harbor-town houses — across Providence, Bristol, Pawtucket, and Newport.</p>
        <p>We buy character buildings and take care of them: modern kitchens and baths, in-unit laundry where possible, off-street parking, and responsive, hands-on management. Many of our homes sit steps from the water, the East Side, or a village main street.</p>
        <p>Whether you're a student, a professional, or a family putting down roots in the Ocean State, we'd love to show you home.</p>
        <p style="margin-top:18px"><a class="btn navy" href="#/available">Browse Availability</a></p>
      </div>
      <div class="imgs">${galsample.map(g=>`<img src="${g}" alt="Windmill Properties home" loading="lazy">`).join('')}</div>
    </div>
  </div></section>
  <section class="pad" style="background:#fff;border-top:1px solid var(--line)"><div class="wrap">
    <div class="kick">Neighborhoods</div>
    <h2 class="sec">Find Your City</h2>
    <p class="lead">From the East Side of Providence to Bristol Harbor — pick a city to explore every building and unit.</p>
    <div class="cities">${cityCards}</div>
  </div></section>`;
}

function vCity(id){
  const c = D.cities.find(x => x.id === id);
  if (!c) return vHome();
  const plist = D.properties.filter(p => p.city === c.name);
  const cards = plist.map(p => {
    const av = p.units.filter(u=>u.status==='available').length;
    const cm = p.units.filter(u=>u.status==='coming').length;
    const beds = p.units.map(u=>u.beds).filter(b=>b!=='G'&&b!==''&&b!==null);
    const bmin = Math.min(...beds), bmax = Math.max(...beds);
    const bt = beds.length ? (bmin===bmax ? bedTxt(bmin) : `${bmin===0?'Studio':bmin+' bed'} – ${bmax} bed`) : 'Garage bays';
    return `
    <div class="pcard" onclick="location.hash='#/property/${p.slug}'">
      <div class="ph">${p.img ? `<img src="${p.img}" alt="${p.name}" loading="lazy">` : millPh}</div>
      <div class="bd">
        <h3>${p.name}</h3>
        <div class="meta">${p.units.length} unit${p.units.length>1?'s':''} · ${bt}</div>
        <div class="chips">
          ${av?`<span class="chip av">${av} available now</span>`:''}
          ${cm?`<span class="chip cm">${cm} coming soon</span>`:''}
          ${!av&&!cm?`<span class="chip">Fully occupied</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="cityhero">
    ${c.hero?`<img src="${c.hero}" alt="${c.name}">`:''}
    <div class="ov"></div>
    <div class="inner">
      <div class="crumbs"><a href="#/">Home</a> / ${c.name}</div>
      <h1>${c.name}</h1>
      <p>${c.blurb}</p>
    </div>
  </div>
  <section class="pad"><div class="wrap">
    <div class="grid3">${cards}</div>
  </div></section>`;
}

function vProperty(slug){
  const p = propBy(slug);
  if (!p) return vHome();
  const cid = D.cities.find(c=>c.name===p.city)?.id || '';
  const units = p.units.map((u,i) => {
    const sp = [bedTxt(u.beds), u.baths?u.baths+' bath':null].filter(Boolean).join(' · ');
    const facts = [];
    if (u.parking==='Y') facts.push('Off-street parking');
    if (u.laundry==='Y') facts.push('In-unit laundry');
    const badge = u.status==='available' ? '<span class="badge av">Available Now</span>'
                : u.status==='coming' ? '<span class="badge cm">Coming Soon</span>'
                : '<span class="badge oc">Occupied</span>';
    const rent = (u.status!=='occupied' && u.rent) ? `<span class="rent">${money(u.rent)}<small style="color:var(--mut);font-weight:600">/mo</small></span>` : '';
    const gal = u.gallery.length
      ? `<div class="ugal">${u.gallery.map((g,gi)=>`<img src="${g}" loading="lazy" alt="${p.name} ${u.label}" onclick="lbOpen(GA['${p.slug}|${i}'],${gi})">`).join('')}</div>`
      : `<div class="nogal">Interior photos coming soon — contact us for a tour.</div>`;
    const inq = u.status!=='occupied'
      ? `<div class="inq"><a href="#/contact" target="_blank" rel="noopener">Contact us about this unit →</a></div>` : '';
    return `
    <div class="unit" id="u${i}">
      <div class="head" onclick="this.parentNode.classList.toggle('open')">
        <span class="caret">▶</span>
        <span class="nm">${u.label}</span>
        <span class="sp">${sp}</span>
        <span class="right">${rent}${badge}</span>
      </div>
      <div class="body">
        ${facts.length?`<div class="facts">${facts.map(f=>`<span class="chip">${f}</span>`).join('')}</div>`:''}
        ${gal}${inq}
      </div>
    </div>`;
  }).join('');
  const pg = p.gallery.length
    ? `<div class="pgal">${p.gallery.map((g,gi)=>`<img src="${g}" loading="lazy" alt="${p.name}" onclick="lbOpen(GA['${p.slug}|P'],${gi})">`).join('')}</div>` : '';
  return `
  <div class="prophead"><div class="wrap">
    <div class="crumbs"><a href="#/">Home</a> / <a href="#/city/${cid}">${p.city}</a> / ${p.name}</div>
    <h1>${p.name}</h1>
    <div class="meta">${p.city}${p.city.includes('CT')?'':', Rhode Island'} · ${p.units.length} unit${p.units.length>1?'s':''}</div>
  </div></div>
  <section style="padding:34px 0 60px"><div class="wrap">
    <div class="propmain">
      <div>
        <div class="bigph">${p.img?`<img src="${p.img}" alt="${p.name}">`:`<div class="ph" style="aspect-ratio:4/3;background:linear-gradient(135deg,var(--navy),#31518f);position:relative">${millPh}</div>`}</div>
        ${pg}
      </div>
      <div class="units">
        <h2>Units at ${p.name}</h2>
        ${units}
      </div>
    </div>
  </div></section>`;
}

function acard(p, u){
  const img = u.gallery[0] || p.img;
  const sp = [bedTxt(u.beds), u.baths?u.baths+' bath':null, p.city].filter(Boolean).join(' · ');
  return `
  <div class="acard">
    <div class="ph" onclick="location.hash='#/property/${p.slug}'">${img?`<img src="${img}" loading="lazy" alt="${p.name} ${u.label}">`:millPh}</div>
    <div class="bd">
      <h3>${p.name} · ${u.label}</h3>
      <div class="meta">${sp}</div>
      <div class="rentrow">
        <span class="rent">${money(u.rent)}<small>/mo</small></span>
        <a class="btn red" style="padding:9px 16px;font-size:13.5px" href="#/contact" target="_blank" rel="noopener">Contact Us</a>
      </div>
    </div>
  </div>`;
}

function vAvailable(){
  let now = [], soon = [];
  D.properties.forEach(p => p.units.forEach(u => {
    if (u.status==='available') now.push(acard(p,u));
    if (u.status==='coming') soon.push(acard(p,u));
  }));
  return `
  <div class="prophead"><div class="wrap">
    <div class="crumbs"><a href="#/">Home</a> / Available Units</div>
    <h1>Available Units</h1>
    <div class="meta">Updated regularly · call ${D.contact.phone} for same-week showings</div>
  </div></div>
  <section class="pad"><div class="wrap">
    <div class="kick">Move-in Ready</div>
    <h2 class="sec">Available Now</h2>
    ${now.length?`<div class="avail-grid">${now.join('')}</div>`:`<div class="empty">Nothing listed at the moment — check the Coming Soon section below or contact us to join the waitlist.</div>`}
    <div style="height:46px"></div>
    <div class="kick">Under Renovation</div>
    <h2 class="sec">Coming Soon</h2>
    <p class="lead">These homes are being renovated now. Inquire early — renovated units go quickly.</p>
    ${soon.length?`<div class="avail-grid" style="margin-top:26px">${soon.join('')}</div>`:`<div class="empty">No upcoming units right now.</div>`}
  </div></section>`;
}

function vContact(){
  return `
  <div class="prophead"><div class="wrap">
    <div class="crumbs"><a href="#/">Home</a> / Contact</div>
    <h1>Contact Us</h1>
    <div class="meta">Tours, applications, and general questions — we're happy to help.</div>
  </div></div>
  <section class="pad"><div class="wrap">
    <div class="contact-grid">
      <div class="ccard">
        <div class="ic">✉</div>
        <h3>Email</h3>
        <a href="mailto:${D.contact.email}">${D.contact.email}</a>
        <p>Best for applications, documents, and detailed questions.</p>
      </div>
      <div class="ccard">
        <div class="ic">☎</div>
        <h3>Phone</h3>
        <a href="tel:${D.contact.phone_raw}">${D.contact.phone}</a>
        <p>Call or text to schedule a tour.</p>
      </div>
      <div class="ccard">
        <div class="ic">⌂</div>
        <h3>Mailing Address</h3>
        <a style="cursor:default;color:var(--navy)">${D.contact.address}</a>
        <p>Windmill Properties</p>
      </div>
    </div>
    <div class="empty" style="border-style:solid;margin-top:34px">
      Looking for a specific home? Browse by city — ${D.cities.map(c=>`<a href="#/city/${c.id}" style="font-weight:700">${c.name}</a>`).join(' · ')} — or see <a href="#/available" style="font-weight:700">what's available</a>.
    </div>
  </div></section>`;
}

/* ---------- galleries for lightbox ---------- */
const GA = {};
D.properties.forEach(p => {
  if (p.gallery.length) GA[p.slug+'|P'] = p.gallery;
  p.units.forEach((u,i) => { if (u.gallery.length) GA[p.slug+'|'+i] = u.gallery; });
});

/* ---------- lightbox ---------- */
let lbList = [], lbIdx = 0;
function lbOpen(list, idx){ lbList = list; lbIdx = idx; lbShow(); $('#lb').classList.add('on'); document.body.style.overflow='hidden'; }
function lbShow(){ $('#lbimg').src = lbList[lbIdx]; $('#lbcnt').textContent = (lbIdx+1)+' / '+lbList.length; }
function lbStep(d){ lbIdx = (lbIdx + d + lbList.length) % lbList.length; lbShow(); }
function lbClose(){ $('#lb').classList.remove('on'); document.body.style.overflow=''; }
$('#lb').addEventListener('click', e => { if (e.target.id==='lb') lbClose(); });
document.addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('on')) return;
  if (e.key==='Escape') lbClose();
  if (e.key==='ArrowLeft') lbStep(-1);
  if (e.key==='ArrowRight') lbStep(1);
});

/* ---------- router ---------- */
function render(){
  const h = location.hash.replace(/^#\/?/,'');
  const [r, arg] = h.split('/');
  let html, route;
  if (r === 'city' && arg){ html = vCity(arg); route = 'city/'+arg; }
  else if (r === 'property' && arg){ html = vProperty(arg); route = ''; }
  else if (r === 'available'){ html = vAvailable(); route = 'available'; }
  else if (r === 'contact'){ html = vContact(); route = 'contact'; }
  else { html = vHome(); route = 'home'; }
  app.innerHTML = html;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.r === route));
  if (r === 'property' && arg){
    const p = propBy(arg);
    const cid = D.cities.find(c=>c.name===p?.city)?.id;
    if (cid) document.querySelector(`nav a[data-r="city/${cid}"]`)?.classList.add('on');
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
buildNav();
render();
</script>
